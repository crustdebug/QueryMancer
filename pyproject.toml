[project]
name = "querio"
version = "0.3.0"
description = "Ask any SQL database questions in plain English"
readme = "README.md"
requires-python = ">=3.12"

dependencies = [
  "langchain>=1.0.0",
  "langchain-core>=1.0.0",
  "langchain-google-genai>=2.0.0",
  "langchain-groq>=0.3.1",
  "langchain-ollama>=0.3.0",
  "langchain-together>=0.3.0",
  "langchain-perplexity>=1.0.0",
  "sqlalchemy>=2.0.0",
  "psycopg2-binary>=2.9.9",
  "pymysql>=1.1.0",
  "pydantic>=2.11.1",
  "python-dotenv>=1.1.0",
  "rich>=13.9.4",
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
]

[dependency-groups]
dev = [
  "faker>=37.1.0",
  "pre-commit>=4.0.1",
  "pytest>=8.0.0",
  "ruff>=0.8.3",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
pythonpath = [
  "."
]
testpaths = [
  "tests"
]
